name: Zbuduj aplikację na Androida

# Uruchom ręcznie: zakładka "Actions" -> "Zbuduj aplikację na Androida" -> "Run workflow".
# Po kilku minutach plik Rozklad.apk jest w wydaniu "android-najnowsza" (zakładka Releases)
# oraz na dole strony przebiegu (Artifacts). Strona z rozkładem odświeży się sama i pokaże przycisk pobierania.
on:
  workflow_dispatch:

permissions:
  contents: write     # publikacja wydania (Release) z plikiem .apk

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Szybkie testy logiki i tłumaczeń
        run: |
          cd android
          sh tests/run_basic.sh

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Przygotuj Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Zbuduj aplikację (.apk)
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace \
            -PvCode=${{ github.run_number }} -PvName=1.0.${{ github.run_number }}

      - name: Zbierz plik .apk
        run: |
          mkdir -p wynik
          cp android/app/build/outputs/apk/release/app-release.apk wynik/Rozklad.apk
          echo "1.0.${{ github.run_number }}" > wynik/android-wersja.txt
          ls -l wynik
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs wynik/Rozklad.apk || true

      - name: Zapisz plik .apk
        uses: actions/upload-artifact@v4
        with:
          name: rozklad-apk
          path: wynik/Rozklad.apk

      - name: Opublikuj wydanie (stały adres do pobrania na stronie)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-najnowsza -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create android-najnowsza wynik/Rozklad.apk wynik/android-wersja.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Rozkład na Androida ${{ github.run_number }}" \
            --notes "Automatyczna kompilacja aplikacji na Androida (wersja 1.0.${{ github.run_number }}). Plik Rozklad.apk zainstaluj na telefonie z Androidem 5.0 lub nowszym."
